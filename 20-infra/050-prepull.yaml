apiVersion: v1
kind: Namespace
metadata:
  name: prepull
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prepull
  namespace: prepull
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prepull
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prepull
subjects:
- kind: ServiceAccount
  name: prepull
  namespace: prepull
roleRef:
  kind: ClusterRole
  name: prepull
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: prepull
  namespace: prepull
spec:
  selector:
    matchLabels:
      app: prepull
  template:
    metadata:
      labels:
        app: prepull
    spec:
      serviceAccountName: prepull
      tolerations:
        - operator: Exists
      initContainers:
        - name: prepull-once
          image: registry.access.redhat.com/ubi10/ubi:latest
          command: ["/bin/sh", "/etc/prepull/prepull.sh", "once"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            seLinuxOptions:
              type: spc_t
          volumeMounts:
            - name: config
              mountPath: /etc/prepull
              readOnly: true
            - name: crictl
              mountPath: /usr/local/bin/crictl
              readOnly: true
            - name: crio
              mountPath: /run/crio
      containers:
        - name: prepull
          image: registry.access.redhat.com/ubi10/ubi:latest
          command: ["/bin/sh", "/etc/prepull/prepull.sh"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            seLinuxOptions:
              type: spc_t
          volumeMounts:
            - name: config
              mountPath: /etc/prepull
              readOnly: true
            - name: crictl
              mountPath: /usr/local/bin/crictl
              readOnly: true
            - name: crio
              mountPath: /run/crio
      volumes:
        - name: config
          configMap:
            name: prepull
        - name: crictl
          hostPath:
            path: /usr/bin/crictl
            type: File
        - name: crio
          hostPath:
            path: /run/crio
            type: Directory
---
