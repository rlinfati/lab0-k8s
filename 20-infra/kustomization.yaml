apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
- 110-traefik-ns.yaml
- 200-localpath.yaml
- 310-certmanager-ns.yaml
- 311-clusterissuer.yaml
- 400-rbackup-ns.yaml
- 402-rbackup-prepull.yaml
- 403-rbackup-localpath.yaml
- 700-cloudflare.yaml
- 701-cloudflare-prepull.yaml
- 800-tailscale.yaml
- 801-tailscale-prepull.yaml
- 910-nvidia-device-plugin.yaml
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    releaseName: cert-manager
    namespace: cert-manager
    valuesInline:
      installCRDs: true
      global:
        nodeSelector:
          m0net/infralab: "true"
  - name: traefik
    repo: https://traefik.github.io/charts
    releaseName: traefik
    namespace: traefik
    valuesInline:
      deployment:
        kind: DaemonSet
      service:
        spec:
          type: ClusterIP
      ingressClass:
        isDefaultClass: false
      ports:
        web:
          hostPort: 80
        websecure:
          hostPort: 443
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          memory: 256Mi
      nodeSelector:
        m0net/infralab: "true"
patches:
  - path: 401-rbackup-secrets.yaml
