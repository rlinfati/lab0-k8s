apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
- 050-prepull.yaml
- 110-traefik-ns.yaml
- 200-localpath.yaml
- 310-certmanager-ns.yaml
- 311-clusterissuer.yaml
- 400-rbackup-ns.yaml
- 403-rbackup-localpath.yaml
- 700-cloudflare.yaml
- 800-tailscale.yaml
- 910-nvidia-device-plugin.yaml
configMapGenerator:
  - name: prepull
    namespace: prepull
    files:
      - prepull.sh=051-prepull.sh
      - images.txt=051-prepull-images.txt
      - crictl.yaml=051-prepull-crictl.yaml
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    releaseName: cert-manager
    namespace: cert-manager
    valuesInline:
      installCRDs: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 256Mi
      cainjector:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
      webhook:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
      global:
        nodeSelector:
          m0net/infralab: "true"
  - name: traefik
    repo: https://traefik.github.io/charts
    releaseName: traefik
    namespace: traefik
    valuesInline:
      deployment:
        kind: DaemonSet
      service:
        spec:
          type: ClusterIP
      ingressClass:
        isDefaultClass: false
      ports:
        web:
          hostPort: 80
        websecure:
          hostPort: 443
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          memory: 256Mi
      nodeSelector:
        m0net/infralab: "true"
patches:
  - path: 401-rbackup-secrets.yaml
