apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yfinance
  namespace: rbackup
spec:
  storageClassName: localpath
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yfinance-script
  namespace: rbackup
data:
  script.py: |
    # script.py
  next_run.py: |
    # next_run.py
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rbackup-yfinance
  namespace: rbackup
spec:
  selector:
    matchLabels:
      app: rbackup-yfinance
  template:
    metadata:
      labels:
        app: rbackup-yfinance
    spec:
      nodeSelector:
        m0net/run.yfinance: "true"
      containers:
      - name: rbackup
        image: ghcr.io/rlinfati/lab0-container:rbackup
        command:
          - /bin/sh
          - -c
          - |
            set -ex
            #
            mkdir -p $HOME/.config/rclone/
            cp /run/rbackup-config/rclone.conf $HOME/.config/rclone/rclone.conf
            #
            rclone version
            #
            cd /opt/yfinance || exit 1
            python3 -m venv /opt/yfinance
            source /opt/yfinance/bin/activate
            pip install --quiet --no-cache-dir yfinance openpyxl matplotlib tzdata
            #
            python3 /run/yfinance-script/script.py || echo "[ERROR] script.py failed"
            while true; do
              sleep "$(python3 /run/yfinance-script/next_run.py)"
              python3 /run/yfinance-script/script.py || echo "[ERROR] script.py failed"
            done
        env:
          - name: K8SNODENAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        volumeMounts:
        - name: rbackup-config
          mountPath: /run/rbackup-config/
          readOnly: true
        - name: yfinance-script
          mountPath: /run/yfinance-script/
          readOnly: true
        - name: yfinance
          mountPath: /opt/yfinance
      volumes:
      - name: rbackup-config
        secret:
          secretName: config
      - name: yfinance-script
        configMap:
          name: yfinance-script
      - name: yfinance
        persistentVolumeClaim:
          claimName: yfinance
---
