apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../20-infra/
  - ../../30-apps/
components:
  - ../common/
patches:
# 20-infra - https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  - target:
      namespace: kube-flannel
      kind: DaemonSet
      name: kube-flannel-ds
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --iface=tailscale0
# 30-apps/100-jupyterhub.yaml
  - target:
      kind: Secret
      name: jhub.oauth
      namespace: jupyterhub
    patch: |-
      kind: Secret
      metadata:
        name: jhub.oauth
      stringData:
        AuthMode: shared-password
# 30-apps/109-jupyterhub-ingress.yaml
  - target:
      group: networking.k8s.io
      kind: Ingress
      name: jupyterhub
      namespace: jupyterhub
    patch: |-
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: web
      - op: remove
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
      - op: remove
        path: /spec/tls
      - op: remove
        path: /spec/rules/0/host
